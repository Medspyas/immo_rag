# Sert le front compilé et relaie /api vers le conteneur de l'API : le
# navigateur ne voit qu'une origine, aucun réglage CORS nécessaire.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Une génération de réponse prend plusieurs secondes (reclasseur, LLM,
    # garde-fous) : délai porté à 5 min pour ne pas couper une requête lente.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Les fichiers compilés portent une empreinte dans leur nom : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Application monopage : toute autre adresse (/documents…) renvoie
    # index.html, le routeur React affiche la bonne page.
    location / {
        try_files $uri /index.html;
    }
}
