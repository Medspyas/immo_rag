services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: immo
      POSTGRES_PASSWORD: immo
      POSTGRES_DB: immo_rag
    ports:
      # 5433 côté hôte : un Postgres natif occupe déjà 5432 sur cette machine.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immo -d immo_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      # Dans le réseau compose, la base s'appelle « db » et écoute sur 5432 ;
      # l'adresse de .env (localhost:5433) ne vaut que depuis l'hôte.
      DATABASE_URL: postgresql://immo:immo@db:5432/immo_rag
      # Reclasseur ONNX sur processeur : mêmes scores que PyTorch, environ
      # deux fois plus rapide (lots triés par longueur, mesuré le 2026-11-05).
      # Le modèle exporté (scripts/exporter_reclasseur_onnx.py, ~2,2 Go)
      # reste hors de l'image et se monte en lecture seule.
      RERANK_PROVIDER: onnx
      RERANK_ONNX_DIR: /app/models/reclasseur_onnx
      # Modèles chargés au démarrage : la première question n'attend pas.
      PRECHAUFFER: "true"
    ports:
      - "8000:8000"
    volumes:
      # Modèles Hugging Face téléchargés une seule fois, gardés entre redémarrages.
      - hf_cache:/app/.cache/huggingface
      - ./.cache/reclasseur_onnx:/app/models/reclasseur_onnx:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      # Interface web : http://localhost:8080
      - "8080:80"
    depends_on:
      - api

volumes:
  db_data:
  hf_cache:
